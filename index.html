<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оргструктура фонда</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="app-style">
/* Каркас: шапка с режимами → вкладки (Схема · Роли · Процессы · Открыто). Схема = вертикали × горизонталь PM. */
:root{
  --paper:#FBFAF7; --ivory:#F5F2EC; --sand:#F0E6DB; --card:#FFFFFF;
  --ink:#262624; --ink-2:#5C5A54; --ink-3:#8A867E; --line:#DED7CC;
  --petrol:#1C4A43; --petrol-soft:#E4ECE9; --on-petrol:#FFFFFF;
  --copper:#A8693D; --copper-soft:#F4E8DD;
  --brick:#9A4434; --brick-soft:#F5E4DF;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1C1C1A; --ivory:#232321; --sand:#2E2A25; --card:#262624;
  --ink:#F2EEE6; --ink-2:#BDB7AC; --ink-3:#8F8A81; --line:#3B3A36;
  --petrol:#86BAAE; --petrol-soft:#21322E; --on-petrol:#10201D;
  --copper:#D9A27A; --copper-soft:#3A2C22;
  --brick:#E09483; --brick-soft:#3B2622; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1C1C1A; --ivory:#232321; --sand:#2E2A25; --card:#262624;
  --ink:#F2EEE6; --ink-2:#BDB7AC; --ink-3:#8F8A81; --line:#3B3A36;
  --petrol:#86BAAE; --petrol-soft:#21322E; --on-petrol:#10201D;
  --copper:#D9A27A; --copper-soft:#3A2C22;
  --brick:#E09483; --brick-soft:#3B2622; color-scheme:dark}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.linkbox{display:flex;gap:8px;margin-top:10px}.linkbox input{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
#root{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* шапка */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.mark{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);font-weight:600}
.mark svg{flex:none}
h1{font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.01em;margin-top:6px}
.sub{color:var(--ink-2);margin-top:4px;font-size:14px}
.sub .mono{font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 13px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,.cell:focus-visible,[contenteditable]:focus-visible,select:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.notice{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--copper-soft);color:var(--ink);font-size:14px}
.notice[data-kind="info"]{background:var(--petrol-soft)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:13px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* статусы */
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;box-sizing:border-box}
.dot.f{background:var(--petrol)}
.dot.p{border:2px solid var(--copper)}
.dot.o{border:2px dashed var(--brick)}
.dot.t{border:2px dotted var(--ink-3)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:0}
.st.fact{background:var(--petrol-soft);color:var(--petrol)}
.st.propose{background:var(--copper-soft);color:var(--copper)}
.st.open{background:var(--brick-soft);color:var(--brick)}
.st.target{background:var(--ivory);color:var(--ink-2);outline:1px dashed var(--ink-3)}
button.st{cursor:pointer}

/* вкладки */
.tabs{display:flex;gap:4px;margin-top:26px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--copper)}
.tab .n{font-family:var(--mono);font-size:12px;color:var(--brick);margin-left:4px}
.pane{margin-top:24px}
.lead{max-width:72ch;color:var(--ink-2);margin:0 0 18px}

/* схема */
.owners{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.blabel{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.mini{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;min-width:0}
.mini:hover{border-color:var(--ink-3)}
.mini .t{font-weight:600;font-size:14px;display:flex;gap:7px;align-items:center}
.mini .pp{font-size:13px;color:var(--ink-2)}
.mini .rp{font-size:12px;color:var(--ink-3)}
.mini .rp.open{color:var(--brick)}
.mini.dashed{border-style:dashed}
.mini.target{border-style:dashed;background:transparent;color:var(--ink-2)}
.mini.lead-card{border-color:var(--petrol);border-width:1.5px}
.stem{width:2px;height:18px;background:var(--line);margin-left:28px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:0}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--ivory);min-width:0}
.panel h2{font-size:17px;font-weight:600}
.panel .ph{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.panel .ph .pn{font-size:13px;color:var(--ink-2)}
.prodhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.branches{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.2fr) 28px minmax(0,1fr);gap:0;align-items:stretch;margin-top:16px}
@media (max-width:700px){.branches{grid-template-columns:minmax(0,1fr)}.branches .arr{transform:rotate(90deg);height:24px}}
.br{border-radius:var(--r);padding:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.br .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.br .v{font-weight:600;margin-top:2px}
.br .d{font-size:13px;color:var(--ink-2);margin-top:4px}
.br.gate{background:var(--sand);border-style:dashed;border-color:var(--copper)}
.arr{display:flex;align-items:center;justify-content:center;color:var(--copper)}
.mx-wrap{overflow-x:auto;margin-top:16px;border-radius:var(--r)}
.mx{display:grid;gap:8px;min-width:760px}
.mx .row{display:grid;gap:8px;grid-template-columns:var(--cols);align-items:center}
.mx .vh{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:86px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left}
.mx .vh.dashed{border-style:dashed}
.mx .vh .t{font-weight:600;font-size:13.5px}
.mx .vh .pp{font-size:12px;color:var(--ink-2)}
.mx .vh .rp{font-size:11.5px;color:var(--ink-3)}
.mx .vh .rp.open{color:var(--brick)}
.mx .corner{font-size:12px;color:var(--ink-3);padding:4px}
.mx .pmrow{position:relative}
.mx .pml{background:var(--petrol);color:var(--on-petrol);border-radius:var(--r);padding:9px 11px;cursor:pointer;text-align:left;border:0}
.mx .pml .t{font-weight:600;font-size:13.5px}
.mx .pml .pp{font-size:12px;opacity:.85}
.mx .pml.target{background:transparent;color:var(--ink-2);border:1.5px dashed var(--ink-3)}
.mx .bar{grid-column:2 / -1;grid-row:1;height:2px;background:var(--petrol);align-self:center;margin-inline:4px}
.mx .bar.target{background:none;border-top:2px dashed var(--ink-3);height:0}
.mx .touch{grid-row:1;justify-self:center;z-index:1;background:var(--paper);border:1px solid var(--petrol);color:var(--petrol);border-radius:999px;font-size:11.5px;padding:3px 9px;text-align:center;max-width:100%}
.mx .touch.target{border-style:dashed;border-color:var(--ink-3);color:var(--ink-3)}
.mxnote{font-size:13px;color:var(--ink-2);margin-top:10px;max-width:80ch}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .list{display:flex;flex-direction:column;gap:8px}

/* роли */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
@media (max-width:420px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:16px}
.card.flash{border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-soft)}
.card.target{border-style:dashed}
.card .hd{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.card .grp{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.card h3{font-size:17px;font-weight:600;margin-top:2px}
.card .people{font-size:14px;color:var(--ink-2);margin-top:2px}
.card .rep{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--ivory);border-radius:8px}
.card .rep b{font-weight:600;color:var(--ink)}
.card .rep.open b{color:var(--brick)}
.sec .sh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.items li .dot{margin-top:6px}
.items li.no{color:var(--ink-2)}
.items li .x{margin-left:auto;border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0 2px;font-size:16px;line-height:1}
.owns{font-size:14px;padding-left:10px;border-left:2px solid var(--copper)}
.notes{font-size:13px;color:var(--ink-2)}
.card .ft{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}
.dotbtn{border:0;background:none;padding:4px;margin:2px -4px 0;cursor:pointer;display:inline-flex}
.ed{outline:none;border-radius:4px;min-width:2ch}
.editing .ed{background:var(--sand);box-shadow:0 0 0 1px var(--line);padding:0 3px}
.editing .ed:empty::before{content:attr(data-ph);color:var(--ink-3)}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:100%}
.add{border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--ink-2);cursor:pointer;align-self:flex-start}
.add:hover{border-color:var(--ink-3);color:var(--ink)}
.danger{color:var(--brick)}

/* процессы */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
thead th{font-size:12px;font-weight:600;color:var(--ink-2);padding:10px 6px;background:var(--ivory)}
tbody tr:last-child td{border-bottom:0}
td.pn,th.pn{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;padding:9px 12px;min-width:240px;border-right:1px solid var(--line)}
thead th.pn{background:var(--ivory)}
td.pn .w{display:flex;gap:8px;align-items:flex-start}
td.pn .dot{margin-top:6px}
.cell{width:100%;min-height:38px;border:0;background:none;font-family:var(--mono);font-size:13px;font-weight:500;cursor:default;color:var(--ink)}
.editing .cell{cursor:pointer}
.cell.o{background:var(--petrol);color:var(--on-petrol)}
.cell.od{background:var(--petrol);color:var(--on-petrol)}
.cell.d{background:var(--petrol-soft);color:var(--petrol)}
.cell.u{color:var(--ink-2)}
.tlegend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.tlegend .k{font-family:var(--mono);font-weight:600;padding:1px 7px;border-radius:5px;margin-right:4px}

/* открытые вопросы */
.oq{display:flex;flex-direction:column;gap:8px;max-width:900px}
.oq .q{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.oq .q.done{opacity:.6}
.oq .q .body{flex:1;min-width:0}
.oq .q .who{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.foot{margin-top:40px;font-size:12.5px;color:var(--ink-3);max-width:80ch}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s,box-shadow .2s}}
</style>
</head>

  if (editing && act) return '<button class="dotbtn" data-act="'+act+'" '+(extra||"")+' title="'+(ITEM[s]||"")+' — сменить">'+d+'</button>';
  return '<span title="'+(ITEM[s]||"")+'" style="display:inline-flex">'+d+'</span>';
}
function repText(r){
  if (!r.reportsTo) return {open:true, text:"открыто"+(r.reportsNote ? " — "+r.reportsNote : "")};
  var b = roleById(r.reportsTo);
  var who = b ? (b.people.split(/[·(,]/)[0].trim() || b.title) : "—";
  return {open:false, text: who + (r.reportsStatus==="propose" ? " (предлагаю)" : "") + (r.reportsNote ? " — "+r.reportsNote : "")};
}

var ICON = {
  pen:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
  check:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  msg:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  arrow:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
  logo:'<svg width="34" height="12" viewBox="0 0 34 12" aria-hidden="true"><circle cx="5" cy="6" r="4" fill="currentColor"/><line x1="9" y1="6" x2="25" y2="6" stroke="currentColor" stroke-width="1.6"/><circle cx="29" cy="6" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
};

/* ---------- render ---------- */
function render(){
  var D = data();
  var openCount = D.open.filter(function(q){ return q.status!=="done"; }).length;
  var h = '';
  h += '<header class="top"><div><div class="mark">'+ICON.logo+'<span>Фонд-акселератор · команда</span></div>';
  h += '<h1>Оргструктура фонда</h1>';
  h += '<div class="sub">Рабочий каркас · обновлено <span class="mono">'+esc(D.meta.updated)+'</span> · версия <span class="mono">'+esc(D.meta.rev)+'</span></div></div>';
  h += '<div class="tools">';
  if (!editing) {
    h += readOnly ? '<span class="sub">Только просмотр — правки предлагайте комментарием</span>' : '<button class="btn primary" data-act="edit">'+ICON.pen+'Редактировать</button>';
    if (STANDALONE) {
      h += '<button class="btn" data-act="download">Скачать HTML</button><button class="btn" data-act="share">Ссылка со сценарием</button>';
      if (localSource) h += '<button class="btn ghost" data-act="reset-local">Вернуть версию из файла</button>';
    }
  } else {
    h += '<button class="btn primary" data-act="save">'+ICON.check+(STANDALONE ? 'Сохранить у себя' : 'Сохранить для всех')+'</button><button class="btn ghost" data-act="cancel">Отменить правки</button>';
  }
  h += '</div></header>';
  if (notice) h += '<div class="notice" data-kind="'+notice.kind+'" role="status">'+esc(notice.text)+'</div>';
  if (shareLink) h += '<div class="linkbox"><input id="share-link" readonly value="'+esc(shareLink)+'" aria-label="Ссылка со сценарием"><button class="btn small" data-act="copy-link">Копировать</button></div>';
  if (editing) h += '<div class="notice" data-kind="info">Режим правки. Тексты меняются прямо на месте, кружки и статусы — по клику. Ничего не сохраняется, пока не нажата «'+(STANDALONE ? 'Сохранить у себя' : 'Сохранить для всех')+'».</div>';
  h += '<div class="legend"><span><i class="dot f"></i>Факт — подтверждено</span><span><i class="dot p"></i>Предлагаю — гипотеза, не утверждено</span><span><i class="dot o"></i>Открыто — решаем по факту</span><span><i class="dot t"></i>Цель — пока нет человека</span></div>';
  var tabs = [["scheme","Схема"],["roles","Роли и функционал"],["proc","Процессы"],["open","Открытые вопросы"]];
  h += '<nav class="tabs" role="tablist">';
  tabs.forEach(function(t){ h += '<button class="tab" role="tab" aria-selected="'+(tab===t[0])+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+(t[0]==="open" ? '<span class="n">'+openCount+'</span>' : '')+'</button>'; });
  h += '</nav><div class="pane'+(editing?' editing':'')+'">';
  if (tab==="scheme") h += renderScheme();
  else if (tab==="roles") h += renderRoles();
  else if (tab==="proc") h += renderProc();
  else h += renderOpen();
  h += '</div>';
  h += STANDALONE
    ? '<p class="foot">Суммы оплаты на странице не указаны намеренно. «Сохранить у себя» хранит правки только в этом браузере. Чтобы правки увидели все — нажмите «Скачать HTML» и замените этим файлом index.html в репозитории. «Ссылка со сценарием» передаёт вариант без коммита.</p>'
    : '<p class="foot">Суммы оплаты на странице не указаны намеренно. Правки сохраняются как новая версия страницы и видны всем, у кого она открыта. Если у вас доступ только на просмотр — нажмите «Предложить правку» на карточке, комментарий увидит команда.</p>';
  root.innerHTML = h;
  root.classList.toggle("editing", editing);
  if (flashId) { var el = document.getElementById("card-"+flashId); if (el) { el.classList.add("flash"); el.scrollIntoView({block:"start", behavior:"smooth"}); } flashId = null; }
}

function mini(r, extraCls){
  var rp = repText(r);
  var cls = "mini" + (r.status==="target" ? " target" : "") + (!r.reportsTo && r.group!=="own" ? " dashed" : "") + (extraCls ? " "+extraCls : "");
  return '<button class="'+cls+'" data-act="goto" data-id="'+r.id+'"><span class="t"><span class="dot '+(r.status==="target"?"t":r.status==="open"?"o":r.status==="propose"?"p":"f")+'"></span>'+esc(r.title)+'</span><span class="pp">'+esc(r.people)+'</span>'+(r.group!=="own" ? '<span class="rp'+(rp.open?' open':'')+'">→ '+esc(rp.text)+'</span>' : '')+'</button>';
}

function renderScheme(){
  var D = data(), h = '';
  h += '<p class="lead">'+esc(D.meta.lead)+'</p>';
  h += '<div class="blabel">Собственники</div><div class="owners">'+rolesIn("own").map(function(r){return mini(r);}).join("")+'</div>';
  h += '<div class="stem"></div>';
  var mg = rolesIn("mgmt");
  var ceo = mg.filter(function(r){return r.id==="ceo";})[0];
  h += '<div class="owners">'+(ceo?mini(ceo,"lead-card"):"")+'</div><div class="stem"></div>';
  h += '<div class="split"><section class="panel"><div class="ph"><h2>Продукт</h2><span class="pn">вертикали + горизонталь PM</span></div>';
  h += '<div class="prodhead">'+mg.filter(function(r){return r.id!=="ceo";}).map(function(r){return mini(r, r.id==="cpo"?"lead-card":"");}).join("")+'</div>';
  // ветки продукта
  h += '<div class="branches">';
  h += '<div class="br"><div class="k">Ветка 2 · стройка</div><div class="v">Стройка нового</div><div class="d">'+ed("meta.build", D.meta.build, "кто и что")+'</div></div>';
  h += '<div class="arr">'+ICON.arrow+'</div>';
  h += '<div class="br gate"><div class="k">Переход в регулярку '+stChip(D.meta.gateStatus,"cycle-gate")+'</div><div class="d" style="color:var(--ink)">'+ed("meta.gate", D.meta.gate, "условие перехода")+'</div></div>';
  h += '<div class="arr">'+ICON.arrow+'</div>';
  h += '<div class="br"><div class="k">Ветка 1 · регулярный процесс</div><div class="v">Утверждённое, что просто делается</div><div class="d">'+ed("meta.run", D.meta.run, "кто ведёт")+'</div></div>';
  h += '</div>';
  // матрица
  var V = rolesIn("vert"), P = rolesIn("pm");
  var cols = "170px repeat("+Math.max(V.length,1)+", minmax(120px,1fr))";
  h += '<div class="mx-wrap"><div class="mx" style="--cols:'+cols+'">';
  h += '<div class="row"><div class="corner">Вертикали →<br>PM ведут клиента поперёк ↓</div>';
  V.forEach(function(v){ var rp = repText(v);
    h += '<button class="vh'+(!v.reportsTo?' dashed':'')+'" data-act="goto" data-id="'+v.id+'"><span class="t">'+esc(v.title)+'</span><span class="pp">'+esc(v.people)+'</span><span class="rp'+(rp.open?' open':'')+'">→ '+esc(rp.text)+'</span></button>'; });
  h += '</div>';
  P.forEach(function(p){
    var tg = p.status==="target";
    h += '<div class="row pmrow"><button class="pml'+(tg?' target':'')+'" data-act="goto" data-id="'+p.id+'"><div class="t">'+esc(p.title)+'</div><div class="pp">'+esc(p.people)+'</div></button>';
    h += '<div class="bar'+(tg?' target':'')+'"></div>';
    V.forEach(function(v, i){ h += '<span class="touch'+(tg?' target':'')+'" style="grid-column:'+(i+2)+'">'+esc(v.pmTouch||"—")+'</span>'; });
    h += '</div>';
  });
  h += '</div></div>';
  h += '<p class="mxnote">'+esc(D.meta.mxnote)+'</p>';
  h += '</section><aside class="side">';
  [["com","Коммерция и маркетинг"],["side","Проектно и УК"]].forEach(function(g){
    h += '<section class="panel"><div class="ph"><h2>'+g[1]+'</h2></div><div class="list">'+rolesIn(g[0]).map(function(r){return mini(r);}).join("")+'</div></section>';
  });
  h += '</aside></div>';
  return h;
}

function itemList(r, ri, key, cls){
  var arr = r[key] || [];
  if (!arr.length && !editing) return '';
  var h = '<ul class="items">';
  arr.forEach(function(it, ii){
    h += '<li class="'+(cls||"")+'">'+dot(it.s, "cycle-item", 'data-r="'+ri+'" data-k="'+key+'" data-i="'+ii+'"')+ed("roles."+ri+"."+key+"."+ii+".t", it.t, "что делает")
      + (editing ? '<button class="x" data-act="del-item" data-r="'+ri+'" data-k="'+key+'" data-i="'+ii+'" title="Удалить строку" aria-label="Удалить строку">×</button>' : '') + '</li>';
  });
  h += '</ul>';
  if (editing) h += '<button class="add" data-act="add-item" data-r="'+ri+'" data-k="'+key+'">+ строка</button>';
  return h;
}

function renderRoles(){
  var D = data(), h = '';
  h += '<div class="filters"><button class="chip" aria-pressed="'+(filter==="all")+'" data-act="filter" data-v="all">Все</button>';
  D.groups.forEach(function(g){ h += '<button class="chip" aria-pressed="'+(filter===g.id)+'" data-act="filter" data-v="'+g.id+'">'+esc(g.name)+'</button>'; });
  h += '<button class="chip" aria-pressed="'+onlyOpen+'" data-act="only-open">Только где есть открытое</button>';
  if (editing) h += '<button class="add" data-act="add-role">+ Новая роль'+(filter!=="all" ? ' в «'+esc(groupName(filter))+'»' : '')+'</button>';
  h += '</div><div class="cards">';
  D.roles.forEach(function(r, ri){
    if (filter!=="all" && r.group!==filter) return;
    if (onlyOpen) { var has = !r.reportsTo || r.status==="open" || r.status==="target" || ["does","notDoes"].some(function(k){ return (r[k]||[]).some(function(it){ return it.s!=="f"; }); }); if (!has) return; }
    var rp = repText(r);
    h += '<article class="card'+(r.status==="target"?' target':'')+'" id="card-'+r.id+'" data-comment-target>';
    h += '<div class="hd"><div style="min-width:0"><div class="grp">'+(editing ? groupSelect(r, ri) : esc(groupName(r.group)))+'</div><h3>'+ed("roles."+ri+".title", r.title, "роль")+'</h3><div class="people">'+ed("roles."+ri+".people", r.people, "кто")+'</div></div>'+stChip(r.status, "cycle-role", 'data-r="'+ri+'"')+'</div>';
    if (r.group!=="own" || editing) {
      h += '<div class="rep'+(rp.open?' open':'')+'">Подчиняется: ';
      if (editing) {
        h += '<select data-path="roles.'+ri+'.reportsTo" aria-label="Кому подчиняется"><option value="">Открыто</option>';
        D.roles.forEach(function(o){ if (o.id!==r.id) h += '<option value="'+o.id+'"'+(o.id===r.reportsTo?' selected':'')+'>'+esc(o.title+" — "+o.people)+'</option>'; });
        h += '</select><select data-path="roles.'+ri+'.reportsStatus" aria-label="Статус подчинения"><option value="fact"'+(r.reportsStatus!=="propose"?' selected':'')+'>факт</option><option value="propose"'+(r.reportsStatus==="propose"?' selected':'')+'>предлагаю</option></select>';
        h += ed("roles."+ri+".reportsNote", r.reportsNote||"", "пояснение");
      } else h += '<b>'+esc(rp.text)+'</b>';
      h += '</div>';
    }
    h += '<div class="sec"><div class="sh">Что делает</div>'+itemList(r, ri, "does")+'</div>';
    if ((r.notDoes||[]).length || editing) h += '<div class="sec"><div class="sh">Не делает</div>'+itemList(r, ri, "notDoes", "no")+'</div>';
    if (r.owns || editing) h += '<div class="sec"><div class="sh">Отвечает за результат</div><div class="owns">'+ed("roles."+ri+".owns", r.owns||"", "за что отвечает")+'</div></div>';
    if (r.pmTouch!=null && (r.group==="vert" || editing)) h += '<div class="sec"><div class="sh">Что PM берёт из вертикали</div><div class="notes">'+ed("roles."+ri+".pmTouch", r.pmTouch||"", "для схемы")+'</div></div>';
    if (r.notes || editing) h += '<div class="notes">'+ed("roles."+ri+".notes", r.notes||"", "заметки")+'</div>';
    h += '<div class="ft">';
    if (!editing && !commentsOff) h += '<button class="btn small ghost" data-act="comment" data-id="'+r.id+'">'+ICON.msg+'Предложить правку</button>';
    if (editing) h += (pendingDel===r.id ? '<span class="confirm">Удалить роль? <button class="btn small danger" data-act="del-role" data-r="'+ri+'">Да, удалить</button><button class="btn small ghost" data-act="del-cancel">Нет</button></span>' : '<button class="btn small ghost danger" data-act="del-ask" data-id="'+r.id+'">Удалить роль</button>');
    h += '</div></article>';
  });
  h += '</div>';
  return h;
}
function groupSelect(r, ri){
  var h = '<select data-path="roles.'+ri+'.group" aria-label="Блок">';
  data().groups.forEach(function(g){ h += '<option value="'+g.id+'"'+(g.id===r.group?' selected':'')+'>'+esc(g.name)+'</option>'; });
  return h + '</select>';
}

function renderProc(){
  var D = data(), h = '';
  h += '<p class="lead">'+esc(D.meta.procLead)+'</p>';
  h += '<div class="tlegend"><span><span class="k cell o" style="display:inline">О</span>отвечает за результат</span><span><span class="k cell d" style="display:inline">Д</span>делает</span><span><span class="k cell od" style="display:inline">О/Д</span>отвечает и делает</span><span><span class="k" style="display:inline;border:1px solid var(--line)">У</span>участвует или согласует</span></div>';
  h += '<div class="tw"><table><thead><tr><th class="pn">Процесс</th>';
  D.columns.forEach(function(c){ h += '<th scope="col">'+esc(c.name)+'</th>'; });
  if (editing) h += '<th></th>';
  h += '</tr></thead><tbody>';
  D.processes.forEach(function(p, pi){
    h += '<tr><td class="pn"><div class="w">'+dot(p.s, "cycle-proc", 'data-p="'+pi+'"')+'<div>'+ed("processes."+pi+".name", p.name, "процесс")+(p.note||editing ? '<div class="notes">'+ed("processes."+pi+".note", p.note||"", "пояснение")+'</div>' : '')+'</div></div></td>';
    D.columns.forEach(function(c){ var v = p.cells[c.id]||"";
      h += '<td><button class="cell '+(CELL_CLASS[v]||"")+'" '+(editing?'data-act="cell" data-p="'+pi+'" data-c="'+c.id+'"':'tabindex="-1"')+' aria-label="'+esc(p.name+" — "+c.name+": "+(v||"нет"))+'">'+esc(v)+'</button></td>'; });
    if (editing) h += '<td><button class="x btn small ghost danger" data-act="del-proc" data-p="'+pi+'" title="Удалить строку">×</button></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if (editing) h += '<p><button class="add" data-act="add-proc">+ Процесс</button></p>';
  return h;
}

function renderOpen(){
  var D = data(), h = '<p class="lead">Решаем по факту. Когда вопрос закрыт — отметьте «Решено» и поправьте карточку роли.</p><div class="oq">';
  D.open.forEach(function(q, qi){
    var done = q.status==="done";
    h += '<div class="q'+(done?' done':'')+'">'+(editing ? '<button class="st '+(done?'fact':'open')+'" data-act="toggle-q" data-q="'+qi+'">'+(done?'Решено':'Открыто')+'</button>' : '<span class="st '+(done?'fact':'open')+'">'+(done?'Решено':'Открыто')+'</span>');
    h += '<div class="body">'+ed("open."+qi+".text", q.text, "вопрос")+'<div class="who">Кто решает: '+ed("open."+qi+".who", q.who||"", "кто")+'</div></div>';
    if (editing) h += '<button class="x btn small ghost danger" data-act="del-q" data-q="'+qi+'" title="Удалить">×</button>';
    h += '</div>';
  });
  h += '</div>';
  if (editing) h += '<p><button class="add" data-act="add-q">+ Вопрос</button></p>';
  return h;
}

/* ---------- edit plumbing ---------- */
function setPath(obj, path, val){
  var ks = path.split("."), o = obj;
  for (var i=0;i<ks.length-1;i++){ var k = /^\d+$/.test(ks[i]) ? +ks[i] : ks[i]; o = o[k]; if (o==null) return; }
  var last = /^\d+$/.test(ks[ks.length-1]) ? +ks[ks.length-1] : ks[ks.length-1];
  o[last] = val;
}
function stash(){ try { sessionStorage.setItem("org.draft", JSON.stringify({base: state.meta.rev, data: draft})); } catch (e) {} }
function touch(){ dirty = true; stash(); }
function nextOf(arr, v){ var i = arr.indexOf(v); return arr[(i+1) % arr.length]; }
function uid(){ return "r" + Math.random().toString(36).slice(2,8); }

root.addEventListener("input", function(e){
  var el = e.target.closest("[data-path]"); if (!el || !editing || el.tagName==="SELECT") return;
  setPath(draft, el.getAttribute("data-path"), el.innerText.replace(/\n+/g," ").trim()); touch();
});
root.addEventListener("change", function(e){
  var el = e.target; if (!editing || el.tagName!=="SELECT") return;
  setPath(draft, el.getAttribute("data-path"), el.value); touch(); render();
});
root.addEventListener("keydown", function(e){
  if (e.key==="Enter" && e.target.matches && e.target.matches(".ed")) { e.preventDefault(); e.target.blur(); }
});
root.addEventListener("paste", function(e){
  if (!e.target.closest || !e.target.closest(".ed")) return;
  e.preventDefault(); var t = (e.clipboardData||window.clipboardData).getData("text/plain").replace(/\s*\n\s*/g," ");
  document.execCommand("insertText", false, t);
});

root.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var a = b.getAttribute("data-act"), ds = b.dataset;
  if (a==="tab"){ tab = ds.v; try{localStorage.setItem("org.tab", tab);}catch(err){} render(); return; }
  if (a==="filter"){ filter = ds.v; render(); return; }
  if (a==="only-open"){ onlyOpen = !onlyOpen; render(); return; }
  if (a==="goto"){ tab = "roles"; filter = "all"; onlyOpen = false; flashId = ds.id; try{localStorage.setItem("org.tab", tab);}catch(err){} render(); return; }
  if (a==="comment"){ openComment(ds.id, b); return; }
  if (a==="edit"){ draft = JSON.parse(JSON.stringify(state)); editing = true; dirty = false; notice = null; render(); return; }
  if (a==="cancel"){ draft = null; editing = false; dirty = false; pendingDel = null; try{sessionStorage.removeItem("org.draft");}catch(err){} notice = null; render(); return; }
  if (a==="save"){ save(); return; }
  if (a==="download"){ downloadHtml(); return; }
  if (a==="share"){ shareLink = location.href.split("#")[0] + "#s=" + b64enc(JSON.stringify(state)); copyText(shareLink, "Ссылка скопирована. В ней весь текущий вариант схемы."); return; }
  if (a==="copy-link"){ copyText(shareLink, "Ссылка скопирована."); return; }
  if (a==="reset-local"){ try{ localStorage.removeItem("org.local"); }catch(err){} if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    state = fileState; localSource = null; shareLink = null; notice = {kind:"info", text:"Показана версия из файла."}; render(); return; }
  if (!editing) return;
  var R = draft.roles;
  switch (a){
    case "cycle-role": R[+ds.r].status = nextOf(STATUS_ORDER, R[+ds.r].status); break;
    case "cycle-item": var it = R[+ds.r][ds.k][+ds.i]; it.s = nextOf(ITEM_ORDER, it.s); break;
    case "add-item": (R[+ds.r][ds.k] = R[+ds.r][ds.k] || []).push({t:"", s:"p"}); break;
    case "del-item": R[+ds.r][ds.k].splice(+ds.i, 1); break;
    case "add-role":
      var nid = uid(); R.push({id:nid, group: filter!=="all" ? filter : "vert", title:"Новая роль", people:"", reportsTo:"", reportsStatus:"propose", reportsNote:"", status:"propose", does:[{t:"",s:"p"}], notDoes:[], owns:"", notes:"", pmTouch:""});
      flashId = nid; break;
    case "del-ask": pendingDel = ds.id; render(); return;
    case "del-cancel": pendingDel = null; render(); return;
    case "del-role":
      var gone = R[+ds.r].id; R.splice(+ds.r, 1);
      R.forEach(function(r){ if (r.reportsTo===gone) r.reportsTo = ""; }); pendingDel = null; break;
    case "cycle-gate": draft.meta.gateStatus = nextOf(STATUS_ORDER, draft.meta.gateStatus); break;
    case "cycle-proc": var p = draft.processes[+ds.p]; p.s = nextOf(["f","p"], p.s); break;
    case "cell": var pc = draft.processes[+ds.p].cells; pc[ds.c] = nextOf(CELL_ORDER, pc[ds.c]||""); if (!pc[ds.c]) delete pc[ds.c]; break;
    case "add-proc": draft.processes.push({name:"Новый процесс", s:"p", note:"", cells:{}}); break;
    case "del-proc": draft.processes.splice(+ds.p, 1); break;
    case "toggle-q": var q = draft.open[+ds.q]; q.status = q.status==="done" ? "open" : "done"; break;
    case "add-q": draft.open.push({text:"", who:"", status:"open"}); break;
    case "del-q": draft.open.splice(+ds.q, 1); break;
    default: return;
  }
  touch(); render();
});

async function openComment(id, btn){
  var card = document.getElementById("card-"+id) || btn;
  var c = await commentsP;
  if (!c){ commentsOff = true; notice = {kind:"warn", text:"Комментарии со страницы здесь недоступны. Оставьте комментарий через режим комментариев в Claude."}; render(); return; }
  try { var r = await c.openComposer({element: card}); if (!r.opened) { notice = {kind:"info", text:"Сначала закройте уже открытый комментарий."}; render(); } }
  catch (err) { if (err && err.code==="unavailable") { commentsOff = true; notice = {kind:"warn", text:"Комментарии в этом просмотре недоступны."}; render(); } }
}

function today(){ var d = new Date(); function z(n){return (n<10?"0":"")+n;} return z(d.getDate())+"."+z(d.getMonth()+1)+"."+d.getFullYear(); }

function copyText(text, okMsg){
  function fallback(){ shareLink = text; notice = {kind:"info", text:"Скопируйте ссылку из поля ниже."}; render(); var i = document.getElementById("share-link"); if (i) { i.focus(); i.select(); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ notice = {kind:"info", text: okMsg}; render(); }, fallback);
  } else fallback();
}
function downloadHtml(){
  var blob = new Blob([buildDocument(state)], {type:"text/html;charset=utf-8"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "index.html";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  notice = {kind:"info", text:"Скачан index.html с текущим вариантом. Замените им файл в репозитории — тогда правки увидят все."}; render();
}

function buildDocument(s){
  var json = JSON.stringify(s).replace(/</g, "\\u003c");
  if (STANDALONE) {
    return '<!doctype html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n'
      + "<title>Оргструктура фонда</title>\n" + FONTS + "\n"
      + '<style id="app-style">' + document.getElementById("app-style").textContent + "</style>\n</head>\n<body>\n"
      + '<div id="root"></div>\n'
      + '<script type="application/json" id="state">' + json + "<\/script>\n"
      + '<script id="app">' + document.getElementById("app").textContent + "<\/script>\n</body>\n</html>\n";
  }
  return PREFIX
    + "<title>Оргструктура фонда</title>\n" + FONTS + "\n"
    + '<style id="app-style">' + document.getElementById("app-style").textContent + "</style>\n"
    + '<div id="root"></div>\n'
    + '<script type="application/json" id="state">' + json + "<\/script>\n"
    + '<script id="app">' + document.getElementById("app").textContent + "<\/script>"
    + SUFFIX;
}

async function save(){
  if (!dirty){ editing = false; draft = null; render(); return; }
  var next = JSON.parse(JSON.stringify(draft));
  next.meta.rev = (state.meta.rev || 0) + 1; next.meta.updated = today();
  if (STANDALONE) {
    state = next; editing = false; draft = null; dirty = false; shareLink = null;
    try { localStorage.setItem("org.local", JSON.stringify(state)); localSource = "local"; } catch (e) {}
    try { sessionStorage.removeItem("org.draft"); } catch (e) {}
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    notice = {kind:"info", text:"Сохранено в этом браузере. Чтобы правки увидели все — «Скачать HTML» и замените файл в репозитории, или отправьте «Ссылку со сценарием»."};
    render(); return;
  }
  stash();
  notice = {kind:"info", text:"Сохраняю…"}; render();
  var art = await artifactP;
  if (!art){ notice = {kind:"warn", text:"Сохранение в этом просмотре недоступно. Правки остались только у вас — откройте страницу в Claude."}; render(); return; }
  try {
    await art.publish(buildDocument(next));
    try { sessionStorage.removeItem("org.draft"); } catch (e) {}
    notice = {kind:"info", text:"Сохранено. Страница обновится."}; render();
  } catch (err) {
    var code = err && err.code;
    if (code==="conflict") { notice = {kind:"warn", text:"Кто-то сохранил раньше вас. Страница обновится до свежей версии."}; }
    else if (["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].indexOf(code) > -1) {
      readOnly = true; notice = {kind:"warn", text:"У вас доступ только на просмотр — правки не сохранить. Ваш вариант остался на экране; предложите правку комментарием на карточке."};
    }
    else if (code==="rate_limited") notice = {kind:"warn", text:"Слишком частые сохранения. Подождите минуту и сохраните снова."};
    else if (code==="too_large") notice = {kind:"warn", text:"Страница стала слишком большой для сохранения. Сократите тексты."};
    else notice = {kind:"warn", text:"Не удалось сохранить. Правки на месте — попробуйте ещё раз."};
    render();
  }
}

render();
})();
</script>
